name: 🔁 Auto Update GitHub Stats and Graph

on:
  schedule:
    - cron: "*/30 * * * *"  # Every 30 minutes
  workflow_dispatch:

jobs:
  refresh-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger GitHub Stats Cache Refresh
        run: |
          echo "Pinging GitHub Stats services..."
          curl -sSf "https://github-readme-stats.vercel.app/api?username=shekharpranav26&show_icons=true&theme=merko&cache_seconds=1800" > /dev/null
          curl -sSf "https://github-readme-stats.vercel.app/api/top-langs/?username=shekharpranav26&layout=compact&theme=merko&cache_seconds=1800" > /dev/null
          curl -sSf "https://github-readme-streak-stats.herokuapp.com/?user=shekharpranav26&theme=merko" > /dev/null
          curl -sSf "https://github-readme-activity-graph.vercel.app/graph?username=shekharpranav26&theme=merko&bg_color=0D1117&color=58D68D&line=2ECC71&point=1ABC9C" > /dev/null

      - name: Keep Workflow Alive
        uses: gautamkrishnar/keepalive-workflow@v1
